name: Build Job-Shark
on:
  push:
    branches: [main]
  pull_request:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npm run build
      - name: Install API Worker dependencies
        run: npm install --prefix worker
      - name: Typecheck API Worker
        run: npm run typecheck --prefix worker
